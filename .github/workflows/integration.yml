name: Integration Tests

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string

permissions:
  contents: read

env:
  API_BENCHMARK_FEATURES: memory-metadata,disk-writer,opendal-reader-hf
  CARGO_TERM_COLOR: always
  CORE_FEATURES: testing,memory-metadata,disk-writer,opendal-reader-fs,validators

jobs:
  integration:
    name: ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ inputs.runner }}

      - name: Integration tests
        run: cargo nextest run --tests --features "${{ env.CORE_FEATURES }}"

      - name: API benchmark smoke test
        run: cargo bench --bench api_workloads --features "${{ env.API_BENCHMARK_FEATURES }}" -- --test

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage
        run: |
          cargo llvm-cov --workspace --features "${{ env.CORE_FEATURES }}" --no-report
          cargo llvm-cov report --ignore-filename-regex 'src/utils/testing/' --fail-uncovered-lines 0 --fail-uncovered-functions 0 --fail-uncovered-regions 0
