name: Unit Tests

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CORE_FEATURES: testing,memory-metadata,disk-writer,opendal-reader-fs,validators

jobs:
  unit:
    name: ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-${{ inputs.runner }}

      - name: Unit tests
        run: cargo nextest run --lib --features "${{ env.CORE_FEATURES }}"

      - name: Doc tests
        run: cargo test --doc --features "${{ env.CORE_FEATURES }}"
